# Typecheck, lint, test and build the web app on every push and pull request. No secrets, no deploys: Convex tests run
# against convex-test in memory, and convex/_generated is committed so nothing needs a backend.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Uses the version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo typecheck lint test
        env:
          TURBO_TELEMETRY_DISABLED: "1"

      # Production build of the web app (no Convex env needed). Catches server/client boundary
      # mistakes that dev mode and typecheck miss, before they break a Vercel deploy.
      - run: pnpm --filter @pantry/web build
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          NEXT_TELEMETRY_DISABLED: "1"
