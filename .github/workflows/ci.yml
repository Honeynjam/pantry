# `pnpm check` (format check, typecheck, lint, test, web build) on every push and pull request. No secrets, no
# deploys: Convex tests run against convex-test in memory, and convex/_generated is committed so nothing needs a backend.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uses the version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Formatting is a warning, not a failure, until m3/speed, m4/mcp and spaces/model have merged: their files
      # are left unformatted on main so those branches merge cleanly. After each merge, run `pnpm format` in a
      # formatting-only commit; once all three are in, delete continue-on-error so CI runs `pnpm check` in full.
      - name: Format check (prettier)
        id: format
        continue-on-error: true
        run: pnpm check:format
      - name: Warn about unformatted files
        if: steps.format.outcome == 'failure'
        run: echo "::warning::Some files aren't formatted. Run pnpm fix (see the format step above)."

      # The rest of `pnpm check`: turbo typecheck lint test, the scripts/ tests, then a production build of the
      # web app (no Convex env needed). The build catches server/client boundary mistakes that dev mode and
      # typecheck miss, before they break a Vercel deploy.
      - run: pnpm check:code
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          NEXT_TELEMETRY_DISABLED: "1"
